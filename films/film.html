<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Symplectic Tether — films</title>
<style>
html,body{margin:0;height:100%;background:#050608;overflow:hidden;font-family:'Courier New',monospace;color:#c9d2bd}
.hud{position:absolute;background:rgba(4,5,8,.62);padding:10px 14px;border-radius:6px;font-size:15px;line-height:1.5;letter-spacing:.6px;text-shadow:0 0 6px #000}
#tl{left:28px;top:22px}#bl{left:28px;bottom:22px}#br{right:24px;bottom:22px}
h1{font-size:17px;font-weight:normal;letter-spacing:4px;margin:0 0 6px;color:#e6cf92}
.sub{color:#7f8a99;font-size:13px}.v{color:#f1e2b0}.ok{color:#8fe0a0}.bad{color:#ff8080}.spec{color:#c99cff}
#tag{position:absolute;background:rgba(4,5,8,.62);padding:8px 12px;border-radius:6px;right:28px;top:22px;text-align:right;font-size:13px;color:#8a93a3;max-width:620px;line-height:1.45}
#title{position:absolute;left:0;right:0;top:44%;text-align:center;font-size:30px;letter-spacing:10px;color:#ead7a0;opacity:0;text-shadow:0 0 18px #000}
#title small{display:block;font-size:14px;letter-spacing:3px;color:#9aa4b4;margin-top:10px}

</style></head><body>
<div class="hud" id="tl"><h1 id="h1"></h1><div id="flow"></div><div id="stat"></div><div id="div"></div></div>
<div id="tag"></div><div id="title"></div>
<div class="hud" id="bl"><div>t = <span class="v" id="t"></span>   ν = <span class="v" id="nu"></span></div>
<div>E  = ½∫|u|²  <span class="v" id="E"></span> <span class="sub" id="Ea"></span></div>
<div>Z  = ½∫|ω|²  <span class="v" id="Z"></span> <span class="sub" id="Za"></span></div>
<div>H  = ∫u·ω    <span class="v" id="H"></span> <span class="sub" id="Ha"></span></div>
<div>dE/dt + 2νZ  <span class="v" id="res"></span></div>
<div class="sub">particles: <span id="n"></span> (25³ lattice, RK4) · vortex lines: 40 integral curves of ω · grid 24³, 6th-order FD</div></div>
<div class="hud" id="br"><canvas id="rib" width="560" height="250"></canvas></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script src="../src/physics.js"></script>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
const Q=new URLSearchParams(location.search),$=id=>document.getElementById(id);
const FILM=Q.get('film')||'abc',NF=+(Q.get('frames')||900),TEND=+(Q.get('tend')||30);
const mode=FILM==='tg'?'tg':'abc',nu=+(Q.get('nu')||0.05),P={A:1,B:1,C:1},TP=2*Math.PI,DT=1/60;
const W=innerWidth,Hh=innerHeight;
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x050608,FILM==='abc'?0.085:FILM==='tg'?0.04:0.03);
const cam=new THREE.PerspectiveCamera(50,W/Hh,.05,400);
const ren=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});ren.setPixelRatio(1);ren.setSize(W,Hh);ren.setClearColor(0x050608);document.body.prepend(ren.domElement);
const comp=new EffectComposer(ren);comp.addPass(new RenderPass(scene,cam));comp.addPass(new UnrealBloomPass(new THREE.Vector2(W,Hh),FILM==='p2q'?0.8:0.55,0.45,0.3));comp.addPass(new OutputPass());
// ---------- physics state (real) ----------
const L0=Physics.lattice(25),n=L0.length/3;let pos=L0.slice(),t=0;
const stepTo=T=>{while(t<T-1e-9){Physics.rk4(mode,pos,n,t,DT,nu,P);t+=DT;}};
// colour map for |ω| (normalised by current max): deep teal -> violet -> gold -> white
const stops=[[0,'#0d3b4a'],[.35,'#5b3a8e'],[.7,'#e0a84a'],[1,'#fff4d6']].map(([s,c])=>[s,new THREE.Color(c)]);
const cmap=(x,out)=>{x=Math.min(1,Math.max(0,x));for(let i=1;i<stops.length;i++)if(x<=stops[i][0]){const[a,ca]=stops[i-1],[b,cb]=stops[i];return out.copy(ca).lerp(cb,(x-a)/(b-a));}return out.copy(stops[3][1]);};
const glow=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.25,'rgba(255,255,255,.6)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);})();
const pGeo=new THREE.BufferGeometry(),dp=new Float32Array(n*3),pc=new Float32Array(n*3);
pGeo.setAttribute('position',new THREE.BufferAttribute(dp,3));pGeo.setAttribute('color',new THREE.BufferAttribute(pc,3));
const pMat=new THREE.PointsMaterial({size:FILM==='p2q'?.05:.055,map:glow,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:FILM==='p2q'?.85:FILM==='abc'?.28:.4});
const vGeo=new THREE.BufferGeometry(),NL=40,NS=260,DS=.06,vp=new Float32Array(NL*NS*6),vc=new Float32Array(NL*NS*6);
vGeo.setAttribute('position',new THREE.BufferAttribute(vp,3));vGeo.setAttribute('color',new THREE.BufferAttribute(vc,3));
const vMat=new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:FILM==='abc'?.45:.6,depthWrite:false,blending:THREE.AdditiveBlending});
const seeds=[];{let r=12345;const R=()=>(r=(r*16807)%2147483647)/2147483647;for(let i=0;i<NL;i++)seeds.push([R()*TP,R()*TP,R()*TP]);}
const tmp=new THREE.Color(),wr=q=>q-TP*Math.floor(q/TP);
// tiling: copies of the period cell (the flow is 2π-periodic, so copies are exact)
const tiles=FILM==='abc'?[-1,0,1]:FILM==='tg'?[-1,0]:[0];
const world=new THREE.Group();scene.add(world);
if(FILM!=='p2q'){for(const a of tiles)for(const b of tiles)for(const c of (FILM==='tg'?[0]:tiles)){const o=[a*TP,b*TP,c*TP];
  const p=new THREE.Points(pGeo,pMat);p.position.set(...o);world.add(p);const l=new THREE.LineSegments(vGeo,vMat);l.position.set(...o);world.add(l);}
 const box=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(TP,TP,TP)),new THREE.LineBasicMaterial({color:0x334055,transparent:true,opacity:.5}));scene.add(box);}
function paintParticles(map){const m=Physics.MODES[mode];let mx=1e-12;const w=new Float32Array(n);
 for(let i=0;i<n;i++){w[i]=Math.hypot(...m.vort(pos[3*i],pos[3*i+1],pos[3*i+2],t,nu,P));mx=Math.max(mx,w[i]);}
 for(let i=0;i<n;i++){cmap(w[i]/mx,tmp);pc[3*i]=tmp.r;pc[3*i+1]=tmp.g;pc[3*i+2]=tmp.b;const q=[wr(pos[3*i]),wr(pos[3*i+1]),wr(pos[3*i+2])];const o=map(q);dp[3*i]=o[0];dp[3*i+1]=o[1];dp[3*i+2]=o[2];}
 pGeo.attributes.position.needsUpdate=pGeo.attributes.color.needsUpdate=true;}
function vortexLines(){const m=Physics.MODES[mode],dir=(x,y,z)=>{const o=m.vort(x,y,z,t,nu,P),l=Math.hypot(...o);return l<1e-12?[0,0,0]:[o[0]/l,o[1]/l,o[2]/l];};
 let mx=1e-12;const segs=[];
 for(const s0 of seeds){let p=s0.slice();for(let k=0;k<NS;k++){const a=dir(...p),b=dir(p[0]+DS/2*a[0],p[1]+DS/2*a[1],p[2]+DS/2*a[2]),c=dir(p[0]+DS/2*b[0],p[1]+DS/2*b[1],p[2]+DS/2*b[2]),d=dir(p[0]+DS*c[0],p[1]+DS*c[1],p[2]+DS*c[2]);
  const q=p.map((v,j)=>v+DS/6*(a[j]+2*b[j]+2*c[j]+d[j])),w=Math.hypot(...m.vort(...q,t,nu,P));mx=Math.max(mx,w);segs.push([p,q,w]);p=q;}}
 segs.forEach(([p,q,w],i)=>{const sh=p.map(v=>v-wr(v));for(let j=0;j<3;j++){vp[6*i+j]=p[j]-sh[j]-Math.PI;vp[6*i+3+j]=q[j]-sh[j]-Math.PI;}
  const out=q.some((v,j)=>v-sh[j]<0||v-sh[j]>=TP);cmap(.35+.65*w/mx,tmp);const f=out?0:1;for(let e=0;e<2;e++){vc[6*i+3*e]=tmp.r*f;vc[6*i+3*e+1]=tmp.g*f;vc[6*i+3*e+2]=tmp.b*f;}});
 vGeo.attributes.position.needsUpdate=vGeo.attributes.color.needsUpdate=true;}
const cellMap=q=>[q[0]-Math.PI,q[1]-Math.PI,q[2]-Math.PI];
// ---------- P2Q layer (SPECULATIVE / artistic; does not alter the physics) ----------
// phase-space view: (x,y) angles -> standard torus, z angle -> small radial breathing of the tube
const RT=4.2,rt=1.6,torMap=q=>{const r=rt*(0.78+0.22*Math.cos(q[2]));return [(RT+r*Math.cos(q[1]))*Math.cos(q[0]),r*Math.sin(q[1]),(RT+r*Math.cos(q[1]))*Math.sin(q[0])];};
const KN=12,KM=6,kern=[];for(let a=0;a<KN;a++)for(let b=0;b<KM;b++)kern.push([TP*a/KN,TP*b/KM,0]);
let hopObj,kernObj;
if(FILM==='p2q'){world.add(new THREE.Points(pGeo,pMat));
 const kg=new THREE.BufferGeometry();kg.setAttribute('position',new THREE.Float32BufferAttribute(kern.flatMap(torMap),3));
 kernObj=new THREE.Points(kg,new THREE.PointsMaterial({size:.32,map:glow,color:0xb98cff,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));world.add(kernObj);
 const wire=new THREE.Mesh(new THREE.TorusGeometry(RT,rt,48,160),new THREE.MeshBasicMaterial({color:0x1d2a40,wireframe:true,transparent:true,opacity:.18}));wire.rotation.x=Math.PI/2;world.add(wire);
 hopObj=new THREE.LineSegments(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));world.add(hopObj);}
const HOP_EVERY=0.5,HOP_N=160,HOP_LIFE=1.2,ARC=24;
function hops(){ // deterministic: at each hop epoch k, particles chosen by an LCG; each draws a Bezier "jump" to its nearest kernel node, fading over HOP_LIFE
 const segs=[],cols=[],k1=Math.floor(t/HOP_EVERY);
 for(let k=Math.max(0,k1-3);k<=k1;k++){const age=t-k*HOP_EVERY;if(age<0||age>HOP_LIFE)continue;const f=Math.pow(1-age/HOP_LIFE,1.5),grow=Math.min(1,age/.25);let r=(k*2654435761+7)%2147483647||1;
  for(let h=0;h<HOP_N;h++){r=(r*16807)%2147483647;const i=r%n,q=[wr(pos[3*i]),wr(pos[3*i+1]),wr(pos[3*i+2])];
   let best=0,bd=1e9;kern.forEach((K,j)=>{const d=Math.hypot(Math.atan2(Math.sin(q[0]-K[0]),Math.cos(q[0]-K[0])),Math.atan2(Math.sin(q[1]-K[1]),Math.cos(q[1]-K[1])));if(d<bd){bd=d;best=j;}});
   const A=new THREE.Vector3(...torMap(q)),B=new THREE.Vector3(...torMap(kern[best])),M=A.clone().add(B).multiplyScalar(.5),lift=M.clone().setY(0).normalize().multiplyScalar(.9+bd).add(new THREE.Vector3(0,1.2+bd,0));M.add(lift);
   const pt=s=>{const u=1-s;return A.clone().multiplyScalar(u*u).add(M.clone().multiplyScalar(2*u*s)).add(B.clone().multiplyScalar(s*s));};
   const S=Math.ceil(ARC*grow);for(let s=0;s<S;s++){const a=pt(s/ARC),b=pt((s+1)/ARC);segs.push(a.x,a.y,a.z,b.x,b.y,b.z);const c=f*(.35+.65*s/ARC);cols.push(.75*c,.5*c,c,.95*c,.75*c,c);}}}
 hopObj.geometry.setAttribute('position',new THREE.Float32BufferAttribute(segs,3));hopObj.geometry.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));}
// ---------- energy ribbon (2D overlay): numeric grid values as dots on the exact curve ----------
const rib=$('rib').getContext('2d'),hist=[];
function drawRibbon(d,a){hist.push([t,d.E,d.Z,Math.abs(d.residual)]);const c=rib,Wc=560,Hc=250,x0=58,x1=Wc-16,y0=24,y1=Hc-56;c.clearRect(0,0,Wc,Hc);
 const E0=Physics.MODES[mode].analytic(0,nu,P).E,X=s=>x0+(x1-x0)*s/TEND,Y=v=>y1-(y1-y0)*v/E0;
 c.strokeStyle='#26304a';c.lineWidth=1;for(let k=0;k<=6;k++){c.beginPath();c.moveTo(X(TEND*k/6),y0);c.lineTo(X(TEND*k/6),y1);c.stroke();}
 c.font='12px Courier New';c.fillStyle='#8a93a3';c.fillText('ENERGY RIBBON  E(t)/E(0): exact (line) vs grid (dots)',10,15);c.fillText('0',x0-4,y1+14);c.fillText(String(TEND),x1-14,y1+14);c.fillText('1',x0-16,y0+4);
 c.beginPath();for(let s=0;s<=200;s++){const tt=TEND*s/200;const v=Physics.MODES[mode].analytic(tt,nu,P).E;s?c.lineTo(X(tt),Y(v)):c.moveTo(X(tt),Y(v));}c.strokeStyle='rgba(224,168,74,.55)';c.lineWidth=2;c.stroke();
 const g=c.createLinearGradient(0,y0,0,y1);g.addColorStop(0,'rgba(224,168,74,.35)');g.addColorStop(1,'rgba(91,58,142,.05)');c.beginPath();c.moveTo(X(0),y1);hist.forEach(([tt,E])=>c.lineTo(X(tt),Y(E)));c.lineTo(X(t),y1);c.fillStyle=g;c.fill();
 c.fillStyle='#fff4d6';hist.forEach(([tt,E],i)=>{if(i%6==0||i==hist.length-1){c.beginPath();c.arc(X(tt),Y(E),2,0,7);c.fill();}});
 // residual strip (log10 |dE/dt+2νZ|) under the axis
 const ry=Hc-30;c.fillStyle='#8a93a3';c.fillText('log₁₀|dE/dt+2νZ|  (−8 … −2)',10,Hc-6);hist.forEach(([tt,,,r])=>{const l=Math.log10(Math.max(r,1e-12)),h=Math.max(0,Math.min(1,(l+8)/6));c.fillStyle=l<-3?'rgba(143,224,160,.8)':'rgba(255,128,128,.9)';c.fillRect(X(tt),ry-18*h,2,18*h);});}
const fx=x=>x.toExponential(5);let titleTxt='';
function hud(){const d=Physics.fullDiag(mode,t,nu,P),a=Physics.MODES[mode].analytic(t,nu,P);window.__diag={t,E:d.E,Ea:a.E,Z:d.Z,Za:a.Z,H:d.H,Ha:a.H,res:d.residual,rel:d.relResidual,div:d.divMax,n};
 $('t').textContent=t.toFixed(2);$('nu').textContent=nu;$('E').textContent=fx(d.E);$('Ea').textContent='exact '+fx(a.E);$('Z').textContent=fx(d.Z);$('Za').textContent='exact '+fx(a.Z);
 $('H').textContent=d.H.toExponential(5);$('Ha').textContent='exact '+a.H.toExponential(5);$('res').innerHTML='<span class="'+(d.relResidual<1e-3?'ok':'bad')+'">'+d.residual.toExponential(2)+'</span> <span class="sub">(rel '+d.relResidual.toExponential(1)+')</span>';$('n').textContent=n.toLocaleString();
 $('stat').innerHTML='energy identity dE/dt = −2νZ: '+(d.relResidual<1e-3?'<span class="ok">holds</span>':'<span class="bad">FAILS</span>')+' to rel '+d.relResidual.toExponential(1);
 $('div').innerHTML='max|∇·u| = <span class="'+(d.divMax<1e-10?'ok':'bad')+'">'+d.divMax.toExponential(1)+'</span>';drawRibbon(d,a);}
const TXT={abc:['INSIDE THE TORUS','ABC / Beltrami exact Navier–Stokes flow · A=B=C=1 · curl u = u','Camera flies through 3×3×3 exact periodic copies of T³. Everything drawn is computed from the closed-form solution; the HUD compares grid integrals to exact values.'],
 tg:['TAYLOR–GREEN CELLS','2D-in-3D Taylor–Green exact Navier–Stokes flow · H = 0','Counter-rotating vortex columns (ω ∥ z) over 2×2 periodic copies. Particles by RK4; E and Z = 2E decay exactly as e^(−4νt).'],
 p2q:['P2Q · KERNEL JUMPS','phase-space view of the ABC flow on T³ → torus (x, y angles; z = tube breathing)','<span class="spec">SPECULATIVE ART LAYER.</span> The violet arcs are discrete "kernel hops" drawn to a 12×6 node lattice. They are decorative, they do not move the particles, and they are not physical quantum dynamics, not a quantum Navier–Stokes model and not a Clay-problem claim. The particles, colours and HUD numbers are the real ABC solution.']};
const T_=TXT[FILM];$('h1').textContent='SYMPLECTIC TETHER · '+T_[0];$('flow').innerHTML=T_[1];$('tag').innerHTML=T_[2];$('title').innerHTML=T_[0]+'<small>'+T_[1]+'</small>';
// ---------- camera paths ----------
const ease=s=>s*s*(3-2*s);
function camera(s){if(FILM==='abc'){ // approach, enter the cell, drift through tiles, pull back
  const pts=[[16,9,20],[9,5,11],[3.2,1.5,4],[0.8,0.4,0.6],[-2.5,-.8,-1.5],[-5,1.2,2.8],[-3,4,7],[6,7,14]].map(p=>new THREE.Vector3(...p));
  const cur=new THREE.CatmullRomCurve3(pts,false,'centripetal');cam.position.copy(cur.getPoint(ease(s)));const look=cur.getPoint(Math.min(1,ease(s)+.06)).lerp(new THREE.Vector3(0,0,0),s<.15||s>.85?.8:.25);cam.lookAt(look);cam.rotateZ(.25*Math.sin(s*Math.PI*2));}
 else if(FILM==='tg'){const a=-.6+1.6*ease(s),r=14-6*Math.sin(Math.PI*s),h=9-7*ease(s);cam.position.set(r*Math.cos(a)-Math.PI,h-Math.PI,r*Math.sin(a)+Math.PI);cam.lookAt(-Math.PI,-Math.PI,Math.PI);}
 else{const a=.3+2.2*Math.PI*ease(s),r=13-4*Math.sin(Math.PI*s),h=6-3.5*Math.sin(Math.PI*s);cam.position.set(r*Math.cos(a),h,r*Math.sin(a));cam.lookAt(0,-.3,0);}}
if(FILM==='tg'){world.rotation.x=-Math.PI/2;world.position.set(0,-Math.PI,0);scene.children.forEach(o=>{if(o.type==='LineSegments'&&o!==hopObj&&o.parent===scene){o.rotation.x=-Math.PI/2;o.position.set(0,-Math.PI,0);o.visible=false;}});}
window.frame=i=>{const s=i/(NF-1);stepTo(TEND*s);paintParticles(FILM==='p2q'?torMap:cellMap);if(FILM!=='p2q')vortexLines();else{hops();world.rotation.y=.15*t;}
 camera(s);hud();const ti=$('title');ti.style.opacity=String(Math.max(0,Math.min(1,s<.04?s/.015:(.09-s)/.03)));
 comp.render();return window.__diag;};
window.__ready=true;
</script></body></html>
